
name: AutoFix Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 || (curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o g.zip && unzip -q g.zip && ./gradle-8.9/bin/gradle wrapper)
          fi
          chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon || ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
